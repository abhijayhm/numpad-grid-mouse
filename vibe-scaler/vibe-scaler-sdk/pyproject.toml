[project]
name = "vibe-scaler-sdk"
version = "0.1.0"
description = "Vibe Scaler three-agent Python harness (Cursor SDK)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "cursor-sdk>=0.1.0",
]

[project.scripts]
vibe-scaler-sdk = "vibe_scaler_sdk.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
